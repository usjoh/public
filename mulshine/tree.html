// ————— render —————
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const world = document.createElementNS(NS,"g");
svg.appendChild(world);

function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||world).appendChild(e);return e;}

function anchorPts(id){const [x,y,w]=L[id];const h=P[id].capsule?34:(P[id].n2?66:52);return {top:[x+w/2,y],bot:[x+w/2,y+h],h};}

for(const [a,b,t] of LINKS){
  const A=anchorPts(a),B=anchorPts(b);
  const x1=A.bot[0],y1=A.bot[1],x2=B.top[0],y2=B.top[1];
  const my=(y1+y2)/2;
  el("path",{d:`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`,class:"link"+(t?" "+t:"")});
}

for(const [gx,gy,txt] of GLABELS){const t=el("text",{x:gx,y:gy,class:"glabel"});t.textContent=txt;}

for(const id in L){
  const [x,y,w]=L[id],p=P[id];
  const h=p.capsule?34:(p.n2?66:52);
  const g=el("g",{class:(p.capsule?"capsule card ":"card ")+p.cls,transform:`translate(${x},${y})`});
  g.addEventListener("click",()=>openPanel(id));
  el("rect",{width:w,height:h,rx:p.capsule?17:7},g);

// ————— pan & zoom —————
let vx=0, vy=0, scale=1;
function apply(){world.setAttribute("transform",`translate(${vx},${vy}) scale(${scale})`);}
function fit(){
  const bw=2350, bh=2150;
  const W=innerWidth, H=innerHeight;
  scale=Math.min(W/bw, H/bh)*0.96;
  vx=(W-bw*scale)/2; vy=(H-bh*scale)/2+20;
  apply();
}
fit(); addEventListener("resize",fit);
const stage=document.getElementById("stage");
let drag=null, pinch=null;
const pts=new Map();
function zoomAbout(cx,cy,f){scale*=f;vx=cx-(cx-vx)*f;vy=cy-(cy-vy)*f;apply();}
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".card"))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  stage.setPointerCapture(e.pointerId);
  if(pts.size===1){drag={x:e.clientX,y:e.clientY,vx,vy};stage.classList.add("dragging");}
  else if(pts.size===2){
    drag=null;
    const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),scale,vx,vy,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
  }
});
stage.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const f=d/pinch.d;
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    scale=pinch.scale*f;
    vx=mx-(pinch.mx-pinch.vx)*f;
    vy=my-(pinch.my-pinch.vy)*f;
    apply();
  }else if(drag){vx=drag.vx+(e.clientX-drag.x);vy=drag.vy+(e.clientY-drag.y);apply();}
});
function lift(e){
  pts.delete(e.pointerId);
  if(pts.size<2)pinch=null;
  if(pts.size===1){const [a]=[...pts.values()];drag={x:a.x,y:a.y,vx,vy};}
  else if(pts.size===0){drag=null;stage.classList.remove("dragging");}
}
stage.addEventListener("pointerup",lift);
stage.addEventListener("pointercancel",lift);
stage.addEventListener("wheel",e=>{e.preventDefault();zoomAbout(e.clientX,e.clientY,e.deltaY<0?1.1:0.9);},{passive:false});
stage.addEventListener("dblclick",e=>{if(!e.target.closest(".card"))zoomAbout(e.clientX,e.clientY,1.5);});

// ————— detail panel —————
const panel=document.getElementById("panel"), inner=document.getElementById("panelInner");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function openPanel(id){
  const p=P[id];
  let html="";
  if(p.lineage){
    const ln=LINEAGES[p.lineage];
    html=`<h2>${esc(ln.title)}</h2><div class="yrs">${esc(ln.note)}</div><ol class="lineage">`+
      ln.entries.map(e=>`<li>${esc(e)}</li>`).join("")+`</ol>`;
  }else{
    html=`<h2>${esc(p.n1)}${p.n2?" <span style='font-size:15px'>"+esc(p.n2)+"</span>":""}</h2>`+
      `<div class="yrs">${esc(p.yrs||"")}</div><ul class="facts">`+
      p.facts.map(f=>`<li>${esc(f)}</li>`).join("")+`</ul>`+
      (p.s?`<div class="srcs">${esc(srcline(p.s))}</div>`:"");
  }
  inner.innerHTML=html;
  panel.classList.add("open");
}
function closePanel(){panel.classList.remove("open");}
stage.addEventListener("pointerdown",e=>{if(!e.target.closest(".card"))closePanel();});
